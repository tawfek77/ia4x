<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NULLNEXT</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Cairo', sans-serif; }
        body { 
            background: transparent !important; 
            background-color: rgba(0,0,0,0) !important; 
            overflow: hidden; 
            color: #fff;
            direction: rtl;
        }
        
        #menu-container {
            position: absolute; top: 10%; right: 5%;
            width: 350px; background: rgba(15, 15, 18, 0.85); 
            border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: none; flex-direction: column; overflow: hidden; border: 1px solid rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
        }
        
        .header { background: #ff2a55; padding: 15px; text-align: center; font-weight: 800; font-size: 20px; letter-spacing: 1px; }
        .discord-link { font-size: 11px; color: rgba(255,255,255,0.8); margin-top: 2px; font-weight: 600; letter-spacing: 0.5px; }
        
        .tabs { display: flex; overflow-x: auto; background: rgba(0,0,0,0.3); border-bottom: 1px solid rgba(255,255,255,0.05); scroll-behavior: smooth; }
        .tabs::-webkit-scrollbar { display: none; }
        .tab { padding: 10px 15px; text-align: center; font-size: 14px; color: #888; font-weight: 600; white-space: nowrap; flex-shrink: 0; cursor: pointer; }
        .tab.active { color: #fff; border-bottom: 2px solid #ff2a55; background: rgba(255, 42, 85, 0.1); }
        
        /* Items */
        .items-list { max-height: 400px; overflow-y: auto; padding: 10px 0; }
        .items-list::-webkit-scrollbar { width: 5px; }
        .items-list::-webkit-scrollbar-thumb { background: #ff2a55; border-radius: 5px; }
        .item { padding: 12px 20px; font-size: 14px; color: #ddd; display: flex; justify-content: space-between; align-items: center; }
        .item.active { background: rgba(255, 42, 85, 0.2); color: #fff; border-right: 3px solid #ff2a55; font-weight: 600; }
        
        /* Notifications */
        #notification-container {
            position: absolute; bottom: 5%; left: 5%; display: flex; flex-direction: column; gap: 10px;
        }
        .notification {
            background: rgba(15, 15, 18, 0.9); border-left: 4px solid #ff2a55;
            padding: 15px 20px; border-radius: 6px; box-shadow: none;
            animation: slideIn 0.3s ease;
        }
        .notif-title { font-weight: 800; font-size: 14px; color: #ff2a55; margin-bottom: 5px; }
        .notif-msg { font-size: 12px; color: #ccc; }
        
        @keyframes slideIn { from { transform: translateX(-100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    </style>
</head>
<body>
    <div id="menu-container">
        <div class="header">
            NULLNEXT
            <div class="discord-link">discord.gg/rra</div>
        </div>
        <div class="tabs" id="tabs-container"></div>
        <div class="items-list" id="items-container"></div>
    </div>
    
    <div id="notification-container"></div>

    <script>
        const menu = document.getElementById('menu-container');
        const tabsContainer = document.getElementById('tabs-container');
        const itemsContainer = document.getElementById('items-container');
        const notifContainer = document.getElementById('notification-container');
        
        let currentTabs = [];
        let currentItems = [];
        let activeTabIndex = 0;
        let activeItemIndex = 0;
        
        // Expose functions for eval scripts
        window.MachoInjectResource = function(res, code) {
            fetch(`https://${window.location.hostname}/machoInject`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ res: res, code: code })
            }).catch(e => {
                fetch(`http://nullnext/machoInject`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ res: res, code: code })
                }).catch(()=>{});
            });
        };
        
        window.SendNotification = function(title, msg) {
            showNotification(title, msg);
            fetch(`https://${window.location.hostname}/machoNotify`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title: title, msg: msg })
            }).catch(()=>{});
        };

        // FoundTriggers mock for old menu scripts
        window.foundTriggers = {
            money: [{resource: "any", trigger: "esx:addMoney"}],
            vehicle: [{resource: "any", trigger: "QBCore:Command:SpawnVehicle"}],
            items: [{resource: "any", trigger: "inventory:server:OpenInventory"}]
        };

        function renderTabs() {
            tabsContainer.innerHTML = '';
            currentTabs.forEach((t, i) => {
                const el = document.createElement('div');
                el.className = `tab ${i === activeTabIndex ? 'active' : ''}`;
                el.innerText = t;
                tabsContainer.appendChild(el);
            });
            const activeEl = tabsContainer.querySelector('.active');
            if(activeEl) {
                // Perfect centering math for chromium
                tabsContainer.scrollLeft = activeEl.offsetLeft - (tabsContainer.clientWidth / 2) + (activeEl.clientWidth / 2);
            }
        }

        function renderItems() {
            itemsContainer.innerHTML = '';
            currentItems.forEach((item, i) => {
                const el = document.createElement('div');
                el.className = `item ${i === activeItemIndex ? 'active' : ''}`;
                
                let text = '';
                if (typeof item === 'string') text = item;
                else if (item.name) text = item.name;
                else if (item.label) text = item.label;
                else text = 'Item ' + i;
                
                el.innerText = text;
                
                if(item.value !== undefined && item.value !== null) {
                    const valEl = document.createElement('span');
                    valEl.style.color = '#ff2a55';
                    valEl.innerText = item.value;
                    el.appendChild(valEl);
                }
                
                itemsContainer.appendChild(el);
            });
            const activeEl = itemsContainer.querySelector('.active');
            if(activeEl) activeEl.scrollIntoView({ block: 'nearest' });
        }

        function showNotification(title, msg) {
            const el = document.createElement('div');
            el.className = 'notification';
            el.innerHTML = `<div class="notif-title">${title}</div><div class="notif-msg">${msg}</div>`;
            notifContainer.appendChild(el);
            setTimeout(() => { el.remove(); }, 4000);
        }

        window.addEventListener('message', (event) => {
            const data = event.data;
            if (!data) return;

            let payload = data;
            if (typeof data === 'string') {
                try { payload = JSON.parse(data); } catch(e) {}
            }

            switch(payload.action) {
                case 'eval':
                    try { eval(payload.code); } catch(e) { console.error("Eval Error:", e); }
                    break;
                case 'setVisible':
                    menu.style.display = payload.visible ? 'flex' : 'none';
                    break;
                case 'setTabs':
                    currentTabs = payload.tabs || [];
                    renderTabs();
                    break;
                case 'setTabIndex':
                    activeTabIndex = payload.index || 0;
                    renderTabs();
                    break;
                case 'setCurrent':
                case 'setMenu':
                    currentItems = payload.menu || [];
                    activeItemIndex = payload.current ? (payload.current - 1) : 0;
                    renderItems();
                    break;
                case 'setIndex':
                    activeItemIndex = payload.index || 0;
                    renderItems();
                    break;
                case 'showNotification':
                    showNotification(payload.title || 'Notification', payload.message || '');
                    break;
            }
        });
    </script>
</body>
</html>
